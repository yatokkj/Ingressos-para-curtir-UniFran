<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingressos - Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="text-center mb-4">
            <img src="../imagens/1090831.png" alt="Logo IngressosFácil" class="logo">
            <h1 id="titulo" class="h3">Ingressos para curtir</h1>
            <p class="aviso">Bem-vindo aos eventos!</p>
            <p class="aviso">Veja o que nós temos para você.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">

                    <img src="../imagens/images.jpg" alt="Banner de Eventos" class="banner mb-3">

                    <div class="mb-3">
                        <label for="busca" class="form-label fw-semibold">Buscar evento:</label>
                        <input type="text" id="busca" class="form-control" placeholder="Digite para buscar...">
                    </div>

                    <label class="form-label fw-semibold">Eventos:</label>
                    <ul id="eventos" class="list-group mb-3">
                        <li class="list-group-item">Halloween Festa</li>
                        <li class="list-group-item">Metallica Cover</li>
                        <li class="list-group-item">U2 Cover</li>
                    </ul>

                    <button type="button" id="botao" class="btn btn-primary w-100">Comprar</button>

                    <div id="mensagem" class="alert alert-success mt-3 mb-0" role="alert" hidden></div>

                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
